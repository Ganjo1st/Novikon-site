<!DOCTYPE html>
<html>
<head><title>Посты Novikon</title></head>
<body>
    <h1>Все посты</h1>
    <ul id="posts-list"></ul>
    <script>
        fetch('/Novikon-site/posts.json')
            .then(r => r.json())
            .then(posts => {
                const list = document.getElementById('posts-list');
                posts.forEach(post => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = `/Novikon-site/posts/post_${post.id}.html`;
                    a.textContent = post.text.split('\n')[0] || 'Пост';
                    li.appendChild(a);
                    list.appendChild(li);
                });
            });
    </script>
    <p><a href="/Novikon-site/">На главную</a></p>
</body>
</html>
