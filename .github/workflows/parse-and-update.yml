name: Parse Telegram & Update Site

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  parse-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install telethon requests beautifulsoup4 lxml

      # --- Восстановление сессии из секрета ---
      - name: Restore Telegram Session
        env:
          SESSION_BASE64: ${{ secrets.TELEGRAM_SESSION_BASE64 }}
        run: |
          if [ -z "$SESSION_BASE64" ]; then
            echo "❌ Ошибка: Секрет TELEGRAM_SESSION_BASE64 не задан!"
            exit 1
          fi
          echo "$SESSION_BASE64" | base64 --decode > session.session
          echo "✅ Файл session.session успешно восстановлен."
      # ----------------------------------------

      - name: Run parser
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python parser.py
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          # Добавляем все изменения, включая posts/ и assets/
          git add -A
          git diff --staged --quiet || git commit -m "Auto-update news [skip ci]"
          git push
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
          
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
          
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
