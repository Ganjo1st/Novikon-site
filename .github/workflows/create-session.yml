name: Create Telegram Session

on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Код подтверждения из Telegram (оставьте пустым для первого запроса)'
        required: false
        type: string
      password:
        description: 'Пароль 2FA (если включена)'
        required: false
        type: string

jobs:
  create-session:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install telethon==1.36.0

      - name: Create session
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          PHONE_NUMBER: ${{ secrets.PHONE_NUMBER }}
          CODE: ${{ github.event.inputs.code }}
          PASSWORD: ${{ github.event.inputs.password }}
        run: python create_session_github.py

      - name: Validate session file
        if: github.event.inputs.code != ''
        run: |
          python - <<'EOF'
          import sqlite3, sys
          try:
              con = sqlite3.connect("session.session")
              rows = con.execute("SELECT dc_id, server_address, port, length(auth_key) FROM sessions").fetchall()
              con.close()
          except Exception as e:
              print(f"❌ Ошибка чтения session.session: {e}")
              sys.exit(1)
          
          if not rows:
              print("❌ Таблица sessions пуста — сессия не авторизована.")
              sys.exit(1)
          
          valid = [r for r in rows if r[3] and r[3] > 0]
          if not valid:
              print("❌ auth_key пустой — сессия не авторизована.")
              sys.exit(1)
          
          print("✅ Сессия валидна:", valid)
          EOF

      - name: Encode session to Base64
        if: github.event.inputs.code != ''
        run: |
          BASE64=$(base64 -w 0 session.session)
          echo "BASE64_SESSION=$BASE64" >> $GITHUB_ENV
          echo "✅ Сессия закодирована в Base64"

      - name: Upload artifact
        if: github.event.inputs.code != ''
        uses: actions/upload-artifact@v4
        with:
          name: session-file
          path: session.session
          if-no-files-found: error

      - name: Show summary
        if: github.event.inputs.code != ''
        run: |
          echo "### 🔑 Ваша сессия готова!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Base64 (для секрета TELEGRAM_SESSION_BASE64):**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$BASE64_SESSION" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
